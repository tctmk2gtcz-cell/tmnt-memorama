<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TMNT Memorama - Multijugador</title>
  <link rel="stylesheet" href="style.css">
  <!-- API de IFrame de YouTube -->
  <script src="https://www.youtube.com/iframe_api"></script>
</head>
<body>

  <!-- Modal Selector de Modo -->
  <div class="modal-overlay" id="modeModal">
    <div class="modal-content">
      <h2>Selecciona Modo de Juego</h2>
      <p>¿Quiénes enfrentarán el reto ninja?</p>
      <div class="mode-buttons">
        <button class="btn-mode" onclick="startGame(1)">1 Jugador (10 cartas)</button>
        <button class="btn-mode" onclick="startGame(2)">2 Jugadores (18 cartas)</button>
      </div>
    </div>
  </div>

  <!-- Modal de Victoria con Video de YouTube -->
  <div class="modal-overlay" id="winModal" style="display: none;">
    <div class="modal-content" id="winModalContent">
      <h2>¡Victoria Ninja!</h2>
      <p id="winMessage"></p>
      
      <div class="video-container" id="videoContainer">
        <!-- El reproductor se incrusta automáticamente aquí -->
        <div id="youtubePlayer"></div>
      </div>

      <button class="btn-mode" onclick="closeWinModal()">Jugar de Nuevo</button>
    </div>
  </div>

  <!-- Cartel flotante de fallo (lost.gif) -->
  <div class="fail-overlay" id="failOverlay">
    <div class="fail-box">
      <img src="lost.gif" alt="Fallo">
      <span>¡No Coinciden!</span>
    </div>
  </div>

  <header>
    <h1>🐢 Cowabunga! TMNT Memorama</h1>
    <div class="turn-indicator" id="turnDisplay">Turno: Jugador 1</div>
    <div class="stats" id="statsDisplay"></div>
    <button class="btn-action" onclick="showModeModal()">Cambiar Modo</button>
  </header>

  <main class="game-board" id="gameBoard"></main>

  <script src="script.js"></script>
</body>
</html>
