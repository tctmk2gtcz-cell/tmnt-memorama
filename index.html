<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TMNT Memorama - Multijugador</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: #0f1c0f;
      color: #ffffff;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    header {
      margin-bottom: 15px;
      text-align: center;
    }

    h1 {
      color: #4caf50;
      text-shadow: 2px 2px 5px #000;
      margin-bottom: 8px;
    }

    /* Modal de selección de jugadores */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.85);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 100;
    }

    .modal-content {
      background: #1b381b;
      border: 3px solid #4caf50;
      padding: 30px;
      border-radius: 12px;
      text-align: center;
      max-width: 380px;
      width: 90%;
      box-shadow: 0 0 20px rgba(76, 175, 80, 0.4);
    }

    .modal-content h2 {
      color: #ffd700;
      margin-bottom: 15px;
    }

    .mode-buttons {
      display: flex;
      gap: 15px;
      justify-content: center;
      margin-top: 20px;
    }

    .btn-mode {
      background: #2e7d32;
      color: white;
      border: none;
      padding: 12px 20px;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: bold;
      cursor: pointer;
      transition: 0.2s;
    }

    .btn-mode:hover {
      background: #4caf50;
      transform: scale(1.05);
    }

    .turn-indicator {
      font-size: 1.25rem;
      font-weight: bold;
      color: #ffd700;
      margin-bottom: 10px;
      min-height: 30px;
    }

    .stats {
      font-size: 1rem;
      display: flex;
      gap: 20px;
      justify-content: center;
      margin-bottom: 12px;
    }

    .btn-action {
      background-color: #2e7d32;
      color: white;
      border: none;
      padding: 8px 18px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
      transition: background 0.2s;
    }

    .btn-action:hover {
      background-color: #388e3c;
    }

    /* Tablero de juego */
    .game-board {
      display: grid;
      grid-template-columns: repeat(4, 125px);
      gap: 12px;
      perspective: 1000px;
    }

    .card {
      width: 125px;
      height: 125px;
      position: relative;
      transform-style: preserve-3d;
      transition: transform 0.4s ease-in-out;
      cursor: pointer;
    }

    .card.flipped {
      transform: rotateY(180deg);
    }

    .card-face {
      position: absolute;
      width: 100%;
      height: 100%;
      backface-visibility: hidden;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.6);
      user-select: none;
      overflow: hidden;
    }

    .card-front {
      background: #1b381b;
      border: 3px solid #4caf50;
      font-size: 2.5rem;
    }

    .card-back {
      background: #000;
      transform: rotateY(180deg);
      border: 3px solid #ffcc00;
    }

    .card-back img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      pointer-events: none;
    }
  </style>
</head>
<body>

  <!-- Modal Selector -->
  <div class="modal-overlay" id="modeModal">
    <div class="modal-content">
      <h2>Selecciona Modo de Juego</h2>
      <p>¿Quiénes enfrentarán el reto ninja?</p>
      <div class="mode-buttons">
        <button class="btn-mode" onclick="startGame(1)">1 Jugador</button>
        <button class="btn-mode" onclick="startGame(2)">2 Jugadores</button>
      </div>
    </div>
  </div>

  <header>
    <h1>🐢 Cowabunga! TMNT Memorama</h1>
    <div class="turn-indicator" id="turnDisplay">Turno: Jugador 1</div>
    <div class="stats" id="statsDisplay"></div>
    <button class="btn-action" onclick="showModeModal()">Cambiar Modo</button>
  </header>

  <main class="game-board" id="gameBoard"></main>

  <script>
    // --- 1. Sistema de Audio (Archivo Cowabunga + Web Audio para FX) ---
    const cowabungaAudio = new Audio('cowabunga.mp3');
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

    function playCowabunga() {
      cowabungaAudio.currentTime = 0;
      cowabungaAudio.play().catch(() => {});
    }

    function playTone(type) {
      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }

      const now = audioCtx.currentTime;
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.connect(gain);
      gain.connect(audioCtx.destination);

      if (type === 'flip') {
        osc.type = 'sine';
        osc.frequency.setValueAtTime(400, now);
        osc.frequency.exponentialRampToValueAtTime(800, now + 0.08);
        gain.gain.setValueAtTime(0.2, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.08);
        osc.start(now);
        osc.stop(now + 0.08);
      } else if (type === 'mismatch') {
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(220, now);
        osc.frequency.exponentialRampToValueAtTime(110, now + 0.2);
        gain.gain.setValueAtTime(0.2, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.2);
        osc.start(now);
        osc.stop(now + 0.2);
      }
    }

    // --- 2. Personajes locales ---
    const scenes = [
      { id: 'leo', gif: 'leo.gif' },
      { id: 'don', gif: 'don.gif' },
      { id: 'raph', gif: 'raph.gif' },
      { id: 'mike', gif: 'mike.gif' },
      { id: 'splinter', gif: 'splinter.gif' },
      { id: 'shredder', gif: 'shredder.gif' }
    ];

    const board = document.getElementById('gameBoard');
    const turnDisplay = document.getElementById('turnDisplay');
    const statsDisplay = document.getElementById('statsDisplay');
    const modeModal = document.getElementById('modeModal');

    let totalPlayers = 1;
    let currentPlayer = 1;
    let scores = { 1: 0, 2: 0 };
    let moves = 0;
    let matchedPairs = 0;

    let hasFlippedCard = false;
    let lockBoard = false;
    let firstCard, secondCard;

    function showModeModal() {
      modeModal.style.display = 'flex';
    }

    function startGame(playersCount) {
      totalPlayers = playersCount;
      currentPlayer = 1;
      scores = { 1: 0, 2: 0 };
      moves = 0;
      matchedPairs = 0;
      modeModal.style.display = 'none';

      updateHUD();
      buildBoard();
    }

    function updateHUD() {
      if (totalPlayers === 1) {
        turnDisplay.textContent = 'Modo Solitario';
        statsDisplay.innerHTML = `
          <span>Intentos: <strong>${moves}</strong></span>
          <span>Pares: <strong>${matchedPairs}</strong>/${scenes.length}</span>
        `;
      } else {
        turnDisplay.textContent = `Turno: Jugador ${currentPlayer} 🍕`;
        statsDisplay.innerHTML = `
          <span>Jugador 1: <strong>${scores[1]}</strong> pares</span>
          <span>Jugador 2: <strong>${scores[2]}</strong> pares</span>
        `;
      }
    }

    // --- 3. Generar Tablero ---
    function buildBoard() {
      const cards = [...scenes, ...scenes].sort(() => Math.random() - 0.5);
      board.innerHTML = '';
      resetBoard();

      cards.forEach(item => {
        const card = document.createElement('div');
        card.classList.add('card');
        card.dataset.id = item.id;

        card.innerHTML = `
          <div class="card-face card-front">🐢</div>
          <div class="card-face card-back">
            <img src="${item.gif}" alt="${item.id}">
          </div>
        `;

        card.addEventListener('click', flipCard);
        board.appendChild(card);
      });
    }

    // --- 4. Lógica de Turnos y Coincidencias ---
    function flipCard() {
      if (lockBoard || this === firstCard) return;

      playTone('flip');
      this.classList.add('flipped');

      if (!hasFlippedCard) {
        hasFlippedCard = true;
        firstCard = this;
        return;
      }

      secondCard = this;
      moves++;
      checkMatch();
    }

    function checkMatch() {
      const isMatch = firstCard.dataset.id === secondCard.dataset.id;
      isMatch ? handleMatch() : handleMismatch();
    }

    function handleMatch() {
      playCowabunga(); // Reproduce el audio de acierto

      firstCard.removeEventListener('click', flipCard);
      secondCard.removeEventListener('click', flipCard);
      matchedPairs++;

      if (totalPlayers === 2) {
        scores[currentPlayer]++;
      }

      updateHUD();

      if (matchedPairs === scenes.length) {
        setTimeout(handleVictory, 600);
      }

      resetBoard();
    }

    function handleMismatch() {
      lockBoard = true;
      playTone('mismatch');

      setTimeout(() => {
        firstCard.classList.remove('flipped');
        secondCard.classList.remove('flipped');
        resetBoard();

        if (totalPlayers === 2) {
          currentPlayer = currentPlayer === 1 ? 2 : 1;
          updateHUD();
        }
      }, 1000);
    }

    function handleVictory() {
      if (totalPlayers === 1) {
        alert(`¡Victoria Ninja! Completaste el tablero en ${moves} intentos.`);
      } else {
        if (scores[1] > scores[2]) {
          alert(`¡Jugador 1 es el Maestro Ninja Ganador con ${scores[1]} pares! 🏆`);
        } else if (scores[2] > scores[1]) {
          alert(`¡Jugador 2 es el Maestro Ninja Ganador con ${scores[2]} pares! 🏆`);
        } else {
          alert(`¡Empate de Ninjas! Ambos consiguieron ${scores[1]} pares. 🍕`);
        }
      }
    }

    function resetBoard() {
      [hasFlippedCard, lockBoard] = [false, false];
      [firstCard, secondCard] = [null, null];
    }
  </script>
</body>
</html>
